version: "3"

volumes:
  database:
    driver: local
  vault-data:
    driver: local

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - 5432:5432
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ~/apps/postgres-17:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres

  redis:
    image: redis:7.0-alpine
    restart: always
    ports:
      - "6379:6379"
    expose:
      - "6379"
    command: redis-server --save 20 1 --loglevel warning --maxmemory-policy noeviction

  redis-commander:
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8081:8081"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4318:4318"
      - "16686:16686"
  taskforce-connector:
    build: https://github.com/taskforcesh/taskforce-connector.git#master
    environment:
      TASKFORCE_CONNECTION: ${TASKFORCE_CONNECTION:-"local taskforce provisioner"}
      TASKFORCE_TEAM: ${TASKFORCE_TEAM:-Radix}
      TASKFORCE_TOKEN: ${TASKFORCE_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: ${VAULT_TOKEN}
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault/secrets:/vault/secrets
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN}
    command: >
      sh -c "
        vault secrets enable transit 2>/dev/null || true &&
        vault write -f transit/keys/xrd-distribution type=ed25519 2>/dev/null || true &&
        echo $${VAULT_TOKEN} > /vault/secrets/token &&
        chmod 644 /vault/secrets/token &&
        echo 'Vault initialized with ED25519 keys and token file'
      "
    restart: "no"

  vault-agent:
    image: hashicorp/vault:latest
    container_name: vault-agent
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./vault/agent-config-dev.hcl:/vault/config/agent-config.hcl:ro
      - ./vault/secrets:/vault/secrets
    environment:
      VAULT_ADDR: "http://vault:8200"
    command: vault agent -config=/vault/config/agent-config.hcl
    ports:
      - "8100:8100"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:8100/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 5

